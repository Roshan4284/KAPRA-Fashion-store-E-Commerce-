<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KAPRA - Cart</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <style>

        .cart-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 50px 20px 80px;
        }

        .cart-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 30px;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 110px 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 20px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
        }

        .cart-item-image {
            width: 110px;
            height: 125px;
            object-fit: cover;
            background: #f5f5f5;
            border-radius: 5px;
        }

        .cart-item-name {
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: 700;
        }

        .cart-item-price {
            color: #555;
            margin-bottom: 12px;
        }

        .cart-item-quantity {
            display: flex;
            align-items: center;
            width: fit-content;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
        }

        .cart-quantity-btn {
            width: 38px;
            height: 38px;
            border: 0;
            background: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .cart-quantity-btn:hover {
            background: #f3f3f3;
        }

        .cart-quantity-value {
            width: 45px;
            text-align: center;
            font-weight: 600;
        }

        .cart-item-total {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .remove-cart-item {
            border: 0;
            background: transparent;
            color: #dc3545;
            cursor: pointer;
            font-size: 13px;
        }

        .remove-cart-item:hover {
            text-decoration: underline;
        }

        .cart-summary {
            height: fit-content;
            padding: 25px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
        }

        .cart-summary h3 {
            margin-bottom: 25px;
            font-size: 21px;
            font-weight: 700;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #555;
        }

        .summary-total {
            padding-top: 18px;
            margin-top: 18px;
            border-top: 1px solid #ddd;
            color: #222;
            font-size: 20px;
            font-weight: 700;
        }

        .checkout-button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: 0;
            border-radius: 4px;
            background: #222;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .checkout-button:hover {
            background: #ff3f6c;
        }

        .continue-shopping {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: 1px solid #222;
            border-radius: 4px;
            background: #fff;
            color: #222;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
        }

        .continue-shopping:hover {
            background: #222;
            color: #fff;
        }

        .empty-cart {
            padding: 80px 20px;
            text-align: center;
        }

        .empty-cart i {
            font-size: 55px;
            color: #aaa;
        }

        .empty-cart h2 {
            margin-top: 20px;
            font-size: 25px;
        }

        .empty-cart p {
            color: #777;
        }

        .empty-cart a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
        }

        @media (max-width: 850px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            .cart-item {
                grid-template-columns: 80px 1fr;
            }

            .cart-item-image {
                width: 80px;
                height: 95px;
            }

            .cart-item-right {
                grid-column: 1 / -1;
            }

        }

    </style>

</head>


<body>

<div id="navbar"></div>


<main class="cart-page">

    <h1 class="cart-title">
        Shopping Cart
    </h1>


    <!-- =====================================================
         EMPTY CART
    ====================================================== -->

    <div
        id="emptyCart"
        class="empty-cart d-none"
    >

        <i class="bi bi-cart-x"></i>

        <h2>
            Your cart is empty
        </h2>

        <p>
            Looks like you haven't added anything to your cart yet.
        </p>

        <a href="/static/products.html">
            Continue Shopping
        </a>

    </div>



    <!-- =====================================================
         CART CONTENT
    ====================================================== -->

    <div
        id="cartContent"
        class="cart-layout d-none"
    >


        <!-- CART ITEMS -->

        <div
            id="cartItems"
            class="cart-items"
        ></div>



        <!-- SUMMARY -->

        <div class="cart-summary">

            <h3>
                Order Summary
            </h3>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong id="cartSubtotal">
                    ₹0.00
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Shipping
                </span>

                <strong>
                    Free
                </strong>

            </div>


            <div class="summary-row summary-total">

                <span>
                    Total
                </span>

                <strong id="cartTotal">
                    ₹0.00
                </strong>

            </div>


            <button
                id="checkoutButton"
                type="button"
                class="checkout-button"
            >

                <i class="bi bi-lock"></i>

                Checkout

            </button>


            <a
                href="/static/products.html"
                class="continue-shopping"
            >

                Continue Shopping

            </a>


            <div
                id="cartMessage"
                class="mt-3"
            ></div>

        </div>

    </div>

</main>


<script src="/static/js/navbar.js"></script>

<script src="/static/js/cart.js"></script>


</body>

</html>
