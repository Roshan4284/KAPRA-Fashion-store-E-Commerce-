<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KAPRA - Checkout</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>


<!-- =========================================================
     COMMON NAVBAR
========================================================= -->

<div id="navbar"></div>


<!-- =========================================================
     CHECKOUT
========================================================= -->

<div class="container py-5">

    <h1 class="fw-bold mb-4">
        Checkout
    </h1>


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div
        id="loading"
        class="text-center py-5"
    >

        <div
            class="spinner-border"
            role="status"
        ></div>

        <p class="mt-2">
            Loading order summary...
        </p>

    </div>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <div
        id="errorMessage"
        class="alert alert-danger d-none"
    ></div>


    <!-- =====================================================
         CHECKOUT CONTENT
    ====================================================== -->

    <div
        id="checkoutContent"
        class="row g-4 d-none"
    >


        <!-- =================================================
             ORDER ITEMS
        ================================================== -->

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4 class="fw-bold mb-4">
                        Order Items
                    </h4>

                    <div id="checkoutItems"></div>

                </div>

            </div>

        </div>


        <!-- =================================================
             ORDER SUMMARY
        ================================================== -->

        <div class="col-lg-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4 class="fw-bold mb-4">
                        Order Summary
                    </h4>


                    <div
                        class="d-flex
                               justify-content-between
                               mb-3"
                    >

                        <span>
                            Total
                        </span>

                        <strong id="checkoutTotal">
                            ₹0
                        </strong>

                    </div>


                    <hr>


                    <!-- PLACE ORDER -->

                    <button
                        id="placeOrderButton"
                        class="btn btn-dark w-100 btn-lg"
                    >
                        Place Order
                    </button>


                    <!-- BACK TO CART -->

                    <a
                        href="/static/cart.html"
                        class="btn btn-outline-dark w-100 mt-2"
                    >
                        Back to Cart
                    </a>


                    <!-- ORDER MESSAGE -->

                    <div
                        id="orderMessage"
                        class="mt-3"
                    ></div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="/static/js/checkout.js"></script>

<script src="/static/js/navbar.js"></script>


</body>

</html>
