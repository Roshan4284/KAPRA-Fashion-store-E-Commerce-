<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KAPRA - Admin Login</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Admin CSS -->

    <link
        rel="stylesheet"
        href="/static/css/admin.css"
    >

</head>


<body class="admin-login-page">


<div class="admin-login-container">


    <!-- LOGO -->

    <div class="admin-login-logo">

        <h1>
            KAPRA
        </h1>

        <p>
            ADMIN PANEL
        </p>

    </div>


    <!-- LOGIN CARD -->

    <div class="admin-login-card">


        <div class="admin-login-heading">

            <h2>
                Admin Login
            </h2>

            <p>
                Sign in to manage your store
            </p>

        </div>


        <!-- ERROR MESSAGE -->

        <div
            id="loginError"
            class="alert alert-danger d-none"
        ></div>


        <!-- LOGIN FORM -->

        <form id="adminLoginForm">


            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="admin@kapra.com"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <div class="admin-password-wrapper">

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="admin-password-toggle"
                    >

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginButton"
                class="btn btn-dark w-100"
            >

                <span id="loginButtonText">
                    Login
                </span>

                <span
                    id="loginSpinner"
                    class="spinner-border spinner-border-sm d-none"
                    role="status"
                ></span>

            </button>


        </form>


        <!-- BACK TO STORE -->

        <div class="text-center mt-4">

            <a href="/">
                ← Back to Store
            </a>

        </div>


    </div>


</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

const API_URL = "http://127.0.0.1:8000";


const loginForm =
    document.getElementById(
        "adminLoginForm"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginButtonText =
    document.getElementById(
        "loginButtonText"
    );


const loginSpinner =
    document.getElementById(
        "loginSpinner"
    );


const password =
    document.getElementById(
        "password"
    );


const togglePassword =
    document.getElementById(
        "togglePassword"
    );



/* ============================================================
   SHOW / HIDE PASSWORD
============================================================ */

togglePassword.addEventListener(
    "click",
    function () {

        if (
            password.type === "password"
        ) {

            password.type = "text";

            togglePassword.innerHTML =
                '<i class="bi bi-eye-slash"></i>';

        } else {

            password.type = "password";

            togglePassword.innerHTML =
                '<i class="bi bi-eye"></i>';

        }

    }
);



/* ============================================================
   ADMIN LOGIN
============================================================ */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        loginError.classList.add(
            "d-none"
        );


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const passwordValue =
            password.value;


        loginButton.disabled = true;

        loginButtonText.textContent =
            "Logging in...";

        loginSpinner.classList.remove(
            "d-none"
        );


        try {

            const response =
                await fetch(
                    `${API_URL}/auth/login`,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            email: email,

                            password:
                                passwordValue

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Invalid email or password"
                );

            }


            /* =================================================
               SAVE TOKEN
            ================================================= */

            localStorage.setItem(
                "access_token",
                data.access_token
            );


            /* =================================================
               CHECK ADMIN ROLE
            ================================================= */

            const meResponse =
                await fetch(
                    `${API_URL}/auth/me`,
                    {

                        method: "GET",

                        headers: {

                            "Authorization":
                                `Bearer ${data.access_token}`

                        }

                    }
                );


            const user =
                await meResponse.json();


            if (
                !meResponse.ok
            ) {

                localStorage.removeItem(
                    "access_token"
                );

                throw new Error(
                    "Unable to verify account"
                );

            }


            if (
                user.role !== "admin"
            ) {

                localStorage.removeItem(
                    "access_token"
                );

                throw new Error(
                    "Access denied. Admin account required."
                );

            }


            /* =================================================
               ADMIN LOGIN SUCCESS
            ================================================= */

            window.location.href =
                "/static/admin.html";


        } catch (error) {

            console.error(
                "Admin login error:",
                error
            );


            loginError.textContent =
                error.message;


            loginError.classList.remove(
                "d-none"
            );


            loginButton.disabled =
                false;


            loginButtonText.textContent =
                "Login";


            loginSpinner.classList.add(
                "d-none"
            );

        }

    }
);

</script>


</body>

</html>
