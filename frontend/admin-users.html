<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KAPRA - Admin Users</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Admin CSS -->
    <link
        rel="stylesheet"
        href="/static/css/admin.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/admin-users.css"
    >

</head>


<body>


<div class="admin-layout">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="admin-sidebar">

        <div class="admin-logo">

            <h2>KAPRA</h2>

            <span>
                ADMIN PANEL
            </span>

        </div>


        <nav class="admin-nav">

            <a
                href="/static/admin.html"
                class="admin-nav-link"
            >

                <i class="bi bi-grid-1x2-fill"></i>

                <span>
                    Dashboard
                </span>

            </a>


            <a
                href="/static/admin-products.html"
                class="admin-nav-link"
            >

                <i class="bi bi-box-seam"></i>

                <span>
                    Products
                </span>

            </a>


            <a
                href="/static/admin-orders.html"
                class="admin-nav-link"
            >

                <i class="bi bi-cart-check"></i>

                <span>
                    Orders
                </span>

            </a>


            <a
                href="/static/admin-users.html"
                class="admin-nav-link active"
            >

                <i class="bi bi-people"></i>

                <span>
                    Users
                </span>

            </a>

        </nav>


        <div class="admin-sidebar-bottom">

            <a
                href="/"
                class="admin-nav-link"
            >

                <i class="bi bi-shop"></i>

                <span>
                    View Store
                </span>

            </a>


            <button
                type="button"
                id="logoutButton"
                class="admin-nav-link admin-logout"
            >

                <i class="bi bi-box-arrow-right"></i>

                <span>
                    Logout
                </span>

            </button>

        </div>

    </aside>



    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">


        <!-- TOP BAR -->

        <header class="admin-topbar">

            <button
                id="sidebarToggle"
                class="sidebar-toggle"
                type="button"
            >

                <i class="bi bi-list"></i>

            </button>


            <div class="admin-profile">

                <div class="admin-profile-icon">

                    <i class="bi bi-person"></i>

                </div>


                <div>

                    <strong>
                        Admin
                    </strong>

                    <small>
                        Administrator
                    </small>

                </div>

            </div>

        </header>



        <!-- =================================================
             CONTENT
        ================================================== -->

        <div class="admin-content">


            <!-- PAGE HEADER -->

            <div class="admin-users-header">

                <div>

                    <span>
                        KAPRA ADMIN
                    </span>

                    <h1>
                        Users
                    </h1>

                    <p>
                        View registered KAPRA users and their roles.
                    </p>

                </div>


                <button
                    type="button"
                    id="refreshUsersButton"
                    class="btn btn-dark"
                >

                    <i class="bi bi-arrow-clockwise"></i>

                    Refresh

                </button>

            </div>



            <!-- MESSAGE -->

            <div
                id="userMessage"
                class="alert d-none"
            ></div>



            <!-- =================================================
                 USER SUMMARY
            ================================================== -->

            <div class="row g-3 mb-4">


                <div class="col-md-4">

                    <div
                        class="admin-user-summary-card"
                    >

                        <div>

                            <span>
                                Total Users
                            </span>

                            <strong
                                id="totalUsers"
                            >
                                0
                            </strong>

                        </div>


                        <i class="bi bi-people"></i>

                    </div>

                </div>



                <div class="col-md-4">

                    <div
                        class="admin-user-summary-card"
                    >

                        <div>

                            <span>
                                Customers
                            </span>

                            <strong
                                id="totalCustomers"
                            >
                                0
                            </strong>

                        </div>


                        <i class="bi bi-person"></i>

                    </div>

                </div>



                <div class="col-md-4">

                    <div
                        class="admin-user-summary-card"
                    >

                        <div>

                            <span>
                                Admins
                            </span>

                            <strong
                                id="totalAdmins"
                            >
                                0
                            </strong>

                        </div>


                        <i class="bi bi-shield-check"></i>

                    </div>

                </div>

            </div>



            <!-- =================================================
                 USERS TABLE
            ================================================== -->

            <div class="admin-section-card">


                <!-- LOADING -->

                <div
                    id="usersLoading"
                    class="admin-users-loading"
                >

                    <div
                        class="spinner-border"
                        role="status"
                    ></div>

                    <p>
                        Loading users...
                    </p>

                </div>



                <!-- TABLE -->

                <div
                    id="usersTableWrapper"
                    class="table-responsive d-none"
                >

                    <table
                        class="table admin-users-table align-middle"
                    >

                        <thead>

                            <tr>

                                <th>
                                    ID
                                </th>

                                <th>
                                    Name
                                </th>

                                <th>
                                    Email
                                </th>

                                <th>
                                    Role
                                </th>

                                <th>
                                    Registered
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="usersTableBody"
                        >

                        </tbody>

                    </table>

                </div>



                <!-- EMPTY STATE -->

                <div
                    id="noUsers"
                    class="admin-empty-state d-none"
                >

                    <i class="bi bi-person-x"></i>

                    <p>
                        No users found.
                    </p>

                </div>

            </div>

        </div>

    </main>

</div>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>



<!-- Admin Users JS -->

<script
    src="/static/js/admin-users.js"
></script>


</body>

</html>
