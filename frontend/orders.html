<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KAPRA - My Orders</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<!-- COMMON NAVBAR -->
<div id="navbar"></div>


<!-- ORDERS CONTENT -->

<div class="container py-5">

    <div
        class="d-flex justify-content-between
               align-items-center mb-4"
    >

        <h1 class="fw-bold">
            My Orders
        </h1>

        <a
            href="/static/products.html"
            class="btn btn-dark"
        >
            Continue Shopping
        </a>

    </div>


    <!-- LOADING -->

    <div
        id="loading"
        class="text-center py-5"
    >

        <div
            class="spinner-border"
            role="status"
        ></div>

        <p class="mt-2">
            Loading orders...
        </p>

    </div>


    <!-- ERROR -->

    <div
        id="errorMessage"
        class="alert alert-danger d-none"
    ></div>


    <!-- EMPTY ORDERS -->

    <div
        id="emptyOrders"
        class="text-center py-5 d-none"
    >

        <h3>
            No orders yet
        </h3>

        <p class="text-muted">
            You haven't placed any orders yet.
        </p>

        <a
            href="/static/products.html"
            class="btn btn-dark"
        >
            Start Shopping
        </a>

    </div>


    <!-- ORDERS -->

    <div
        id="ordersContent"
        class="d-none"
    >

        <div id="ordersList"></div>

    </div>

</div>


<!-- JAVASCRIPT -->

<script src="/static/js/orders.js"></script>

<script src="/static/js/navbar.js"></script>

</body>

</html>
