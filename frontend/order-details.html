<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KAPRA - Order Details</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>


<!-- =========================================================
     COMMON NAVBAR
========================================================= -->

<div id="navbar"></div>


<!-- =========================================================
     ORDER DETAILS
========================================================= -->

<div class="container py-5">


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div
        id="loading"
        class="text-center py-5"
    >

        <div class="spinner-border"></div>

        <p class="mt-2">
            Loading order details...
        </p>

    </div>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <div
        id="errorMessage"
        class="alert alert-danger d-none"
    ></div>


    <!-- =====================================================
         ORDER CONTENT
    ====================================================== -->

    <div
        id="orderContent"
        class="d-none"
    >


        <!-- =================================================
             HEADER
        ================================================== -->

        <div
            class="d-flex
                   justify-content-between
                   align-items-center
                   mb-4"
        >

            <h1 class="fw-bold">
                Order Details
            </h1>


            <a
                href="/static/orders.html"
                class="btn btn-outline-dark"
            >
                Back to Orders
            </a>

        </div>


        <!-- =================================================
             ORDER INFORMATION
        ================================================== -->

        <div
            class="card shadow-sm mb-4"
        >

            <div class="card-body">

                <div class="row">


                    <!-- ORDER ID -->

                    <div class="col-md-4">

                        <small class="text-muted">
                            Order ID
                        </small>

                        <h5 id="orderId"></h5>

                    </div>


                    <!-- STATUS -->

                    <div class="col-md-4">

                        <small class="text-muted">
                            Status
                        </small>

                        <h5>

                            <span
                                id="orderStatus"
                                class="badge bg-success"
                            ></span>

                        </h5>

                    </div>


                    <!-- USER ID -->

                    <div class="col-md-4">

                        <small class="text-muted">
                            User ID
                        </small>

                        <h5 id="userId"></h5>

                    </div>

                </div>

            </div>

        </div>


        <!-- =================================================
             ORDER ITEMS
        ================================================== -->

        <div class="card shadow-sm">

            <div class="card-body">

                <h4 class="fw-bold mb-4">
                    Order Items
                </h4>


                <div id="orderItems"></div>


                <hr>


                <!-- TOTAL -->

                <div
                    class="d-flex
                           justify-content-between
                           align-items-center"
                >

                    <h4 class="fw-bold mb-0">
                        Total
                    </h4>


                    <h4
                        id="orderTotal"
                        class="fw-bold mb-0"
                    ></h4>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="/static/js/order-details.js"></script>

<script src="/static/js/navbar.js"></script>


</body>

</html>
