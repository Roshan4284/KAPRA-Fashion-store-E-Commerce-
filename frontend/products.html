<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KAPRA - Products</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>


<!-- COMMON NAVBAR -->

<div id="navbar"></div>


<!-- PRODUCTS -->

<div class="container py-5">

    <div
        class="d-flex
               justify-content-between
               align-items-center
               mb-4"
    >

        <div>

            <h1 class="fw-bold">
                Our Products
            </h1>

            <p class="text-muted">
                Discover our latest collection
            </p>

        </div>

    </div>


    <!-- Loading -->

    <div
        id="loading"
        class="text-center py-5"
    >

        <div
            class="spinner-border"
            role="status"
        ></div>

        <p class="mt-2">
            Loading products...
        </p>

    </div>


    <!-- Error -->

    <div
        id="errorMessage"
        class="alert alert-danger d-none"
    ></div>


    <!-- Product Grid -->

    <div
        id="productContainer"
        class="row g-4"
    ></div>


</div>


<!-- JAVASCRIPT -->

<script src="/static/js/products.js"></script>

<script src="/static/js/navbar.js"></script>


</body>

</html>
